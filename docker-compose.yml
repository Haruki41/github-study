services:
  db:
    image: postgres:17
    container_name: taskboard-db
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard_dev_pw   # 学習用のローカル専用パスワード
    ports:
      - "127.0.0.1:5432:5432"               # 自分のPCからのみ接続可能
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
