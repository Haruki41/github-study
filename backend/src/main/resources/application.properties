spring.application.name=taskboard

# API のポート。必ず 8080 で動かす（フロントのプロキシ先、CLAUDE.md のポートのルール）。
# 使用中の場合は別ポートへ逃げず、起動エラーになる。
server.port=8080

# PostgreSQL（docker-compose.yml の db コンテナに接続）
spring.datasource.url=jdbc:postgresql://localhost:5432/taskboard
spring.datasource.username=taskboard
spring.datasource.password=taskboard_dev_pw

# 起動時に schema.sql を実行（冪等に書いてあるので毎回実行して問題ない）
spring.sql.init.mode=always
